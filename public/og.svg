<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Waymark — Rescue your bookmarks</title>
  <desc id="description">A private-first personal action memory for finding and using saved links.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#162541"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7c873"/>
      <stop offset="1" stop-color="#f08b67"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" rx="36" fill="url(#background)"/>
  <circle cx="1030" cy="115" r="210" fill="#223b67" opacity=".42"/>
  <circle cx="1080" cy="560" r="250" fill="#153f3a" opacity=".35"/>
  <g transform="translate(92 92)">
    <path d="M0 0h70v112l-35-22-35 22z" fill="url(#accent)"/>
    <text x="100" y="57" fill="#f8f3e8" font-family="Inter,Segoe UI,sans-serif" font-size="48" font-weight="700">WAYMARK</text>
  </g>
  <text x="92" y="285" fill="#f8f3e8" font-family="Inter,Segoe UI,sans-serif" font-size="75" font-weight="750">
    Rescue your bookmarks.
  </text>
  <text x="92" y="372" fill="#b8c7dc" font-family="Inter,Segoe UI,sans-serif" font-size="36">
    Find what you saved. Turn it into action.
  </text>
  <rect x="92" y="446" width="500" height="74" rx="37" fill="url(#accent)"/>
  <text x="342" y="494" fill="#15101b" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="26" font-weight="700">
    Vikkypaedia Way to Bookmarks
  </text>
</svg>
