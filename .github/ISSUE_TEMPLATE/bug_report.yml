name: Bug report
description: Report something that is broken or confusing.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Waymark. Never attach a real bookmark export.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell us what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      placeholder: Use fictional or redacted examples only.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
    validations:
      required: true
  - type: dropdown
    id: privacy
    attributes:
      label: Does this involve possible data exposure?
      options:
        - "No"
        - "Yes — I will report it privately instead"
    validations:
      required: true
